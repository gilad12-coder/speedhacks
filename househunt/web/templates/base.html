<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if refresh %}<meta http-equiv="refresh" content="5">{% endif %}
  <title>househunt</title>
  <style>
    :root { --bg:#fafaf8; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#2f6f4e; --warn:#a4462b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --line:#2e2e2b; --accent:#6fbf93; --warn:#e48a6c; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; } h1 a { color: inherit; text-decoration: none; }
    h2 { font-size: 17px; margin: 28px 0 8px; }
    .muted { color: var(--muted); } .warn { color: var(--warn); }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .wrap { overflow-x: auto; }
    form.grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display:flex; flex-direction:column; font-size: 13px; color: var(--muted); gap: 4px; }
    input, textarea { font: inherit; padding: 6px 8px; border:1px solid var(--line); border-radius:6px; background: transparent; color: var(--fg); }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
    .pill { display:inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; border:1px solid var(--line); white-space: nowrap; }
    .pill.viable, .pill.tour_scheduled { border-color: var(--accent); color: var(--accent); }
    .pill.filtered, .pill.not_viable { color: var(--muted); }
    details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    pre { white-space: pre-wrap; font-size: 13px; }
    a { color: var(--accent); }
  </style>
</head>
<body><main>
  <h1><a href="/">househunt</a></h1>
  <p class="muted">Call mode: <strong>{{ settings.call_mode.value }}</strong> ·
    Sources: <strong>{{ "mock" if settings.mock_sources else "live" }}</strong></p>
  {% block content %}{% endblock %}
</main></body>
</html>
