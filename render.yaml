# Render blueprint: New > Blueprint > point at this repo.
services:
  - type: web
    name: househunt
    runtime: docker
    plan: starter            # persistent disks need a paid plan
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Link to the household app (Next.js on Vercel)
      - key: APP_URL              # the Vercel production URL, e.g. https://keyhunt.vercel.app
        sync: false
      - key: AGENT_API_KEY        # same value as AGENT_API_KEY in Vercel
        sync: false
      - key: VERCEL_PROTECTION_BYPASS   # only if the Vercel app uses Deployment Protection
        sync: false
      - key: RUN_PLATFORM_WORKER
        value: "1"
      - key: CALL_MODE
        value: approve
      - key: MOCK_SOURCES
        value: "0"
      - key: DIAL_API_KEY
        sync: false
      - key: DIAL_FROM_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NOTIFY_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
